# ============================================================
# Yard Speaker  —  ESP32 + NS4168 I2S amp, streams from Home Assistant
# ------------------------------------------------------------
# Write-up: https://www.allthethings.best/how-i-built-cheap-esp32-yard-speakers-for-halloween-sound-effects/
#
# After flashing, this appears in Home Assistant as:
#     media_player.yard_speaker_a
# For another zone, copy this file and change the two substitutions.
#
# Board: WROOM-32 (classic ESP32, NO PSRAM). Amp: NULLLAB NS4168 kit
# (github.com/nulllaborg/i2s_audio_amplifier_module).
#   * Wiring: BCLK GPIO26, LRC GPIO25, DIN GPIO33 (adjacent header pins),
#     VCC on VIN (5 V), GND. A half-seated DIN jumper = static that ignores
#     the volume slider; DIN on the wrong pin = pop at bus start, no audio.
#   * I2S: stereo (identical L/R, so either slot the amp picks plays),
#     left-justified framing (vendor example: bit_shift=false), 16 kHz,
#     16-bit, no APLL, I2S port 0. Module auto-detects only
#     8/16/32/44.1/48/96 kHz (22.05 kHz is silent).
#   * Classic-ESP32 gotchas measured here: mono at 44.1 kHz and 32-bit
#     slots both play at HALF speed; ESPHome swaps sample pairs for 16-bit
#     mono on this chip. Stereo 16-bit avoids all of it.
#   * Buffers are sized for the ~200 KB heap: oversized buffers exhausted
#     it, the speaker task failed to allocate, and every restart popped.
#     Watch "Heap Free" before growing anything.
# ============================================================

substitutions:
  device_name: yard-speaker-a      # hostname on your network
  friendly_name: Yard Speaker A    # device name shown in Home Assistant

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf          # REQUIRED by the speaker media player (not Arduino)

logger:

# Secrets live in secrets.yaml next to this file (see secrets.example.yaml).
api:
  encryption:
    key: !secret home_assistant_api_key
ota:
  - platform: esphome
    password: !secret esp_ota_pw

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # ESP32 default is "light" (modem sleep). At -74 dBm that delivers
  # audio in bursts with gaps, which starves the small buffers below.
  power_save_mode: none

# Free-heap visibility: sensor "Heap Free" in HA, and "Free heap" in
# the boot log. Use it before raising any buffer size.
debug:
sensor:
  - platform: debug
    free:
      name: Heap Free

# -------------------- Audio --------------------

# I2S bus. The NS4168 has no MCLK input, so no MCLK pin is configured.
i2s_audio:
  i2s_lrclk_pin: GPIO25     # LRC  (word-select clock)
  i2s_bclk_pin: GPIO26      # BCLK (bit clock)

# The NS4168 amp. It is a mono amp that plays either the L or R I2S
# slot (chosen by its CTRL pin). HA sends identical L/R, so either works.
speaker:
  - platform: i2s_audio
    id: ns4168_speaker
    dac_type: external
    i2s_dout_pin: GPIO33    # DIN on the amp
    # Matches the vendor's own ESP32 example for this module: 16 kHz, 16-bit,
    # bit_shift=false (left-justified). Philips framing and 44.1 kHz mono were
    # tried first: the former was silent, the latter played a 2 s tone in 4.2 s.
    channel: stereo         # identical L/R: plays whichever slot the module's CTRL pin selects
    sample_rate: 16000      # in the module's auto-detect table; 64 KB/s stereo over WiFi. 32000/44100 also valid.
    bits_per_sample: 16bit
    i2s_comm_fmt: stand_msb # left-justified, per the vendor's ESP32 example (Philips framing was silent at 16 kHz)
    use_apll: false
    buffer_duration: 300ms  # 16000 Hz * 4 B/frame * 0.3 s = 19.2 KB
    timeout: never          # keep the bus running between clips: no pop per clip

# Media player that HA streams clips to (announcement-only pipeline).
media_player:
  - platform: speaker
    name: None              # use the device's friendly name, so the entity is media_player.yard_speaker_a
    id: yard_speaker
    volume_initial: 50%
    volume_min: 0.5         # slider 0% = -24 dB, 50% = -12 dB, 100% = 0 dB (software volume is -49..0 dB)
    buffer_size: 32000      # HTTP file buffer, ~500 ms at 64 KB/s (stereo 16k)
    files:
      - id: test_tone
        file: test_tone.wav # 2 s, 16 kHz stereo 16-bit; lives next to this yaml
    announcement_pipeline:
      speaker: ns4168_speaker
      format: WAV           # cheapest to decode on a no-PSRAM ESP32
      sample_rate: 16000
      num_channels: 2

# "Test Tone" button in HA: plays the baked-in 2 s tone through the
# announcement pipeline without HA's TTS/ffmpeg path. First thing to press
# when the speaker misbehaves: no tone = wiring/power, tone but bad TTS = HA side.
button:
  - platform: template
    name: Test Tone
    on_press:
      - media_player.speaker.play_on_device_media_file:
          media_file: test_tone
          announcement: true

# ============================================================
# NOTES
# ------------------------------------------------------------
# • Only the announcement pipeline exists: play with announce: true.
#   Each new clip interrupts the last, which suits short scare clips.
#
# • If clips occasionally gap: raise buffer_size toward 48000 and
#   buffer_duration toward 500ms, watching Heap Free stay > ~120 KB.
#   If the log shows "Speaker task setup failed", you went too far.
#
# • Bulletproof alternative for show night: bake clips into the
#   firmware with a `files:` list (plays from flash, no WiFi).
# ============================================================
