# Copy this file to secrets.yaml (same folder as yard-speaker.yaml) and fill it in.
# secrets.yaml is in .gitignore. Never commit the real one.

wifi_ssid: "YOUR_WIFI_NAME"
wifi_password: "YOUR_WIFI_PASSWORD"

# 32-byte base64 key. Generate one at https://esphome.io/components/api/
# (the page makes a fresh key in your browser) or let Device Builder create it.
home_assistant_api_key: "REPLACE_WITH_A_GENERATED_BASE64_KEY"

# Any password you like; needed again for over-the-air updates.
esp_ota_pw: "REPLACE_WITH_AN_OTA_PASSWORD"
