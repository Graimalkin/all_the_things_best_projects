<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Yard speaker wiring</title>
  <desc id="d">Five wires from an ESP32 DevKit V1 to an NS4168 I2S amplifier: VIN to VIN, GND to GND, GPIO26 to BCLK, GPIO25 to LRC, GPIO33 to DIN. The speaker plugs into the amplifier.</desc>
  <rect width="840" height="380" fill="#ffffff"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2328">ESP32 to NS4168 amp: five wires, no soldering</text>

  <!-- ESP32 -->
  <rect x="40" y="70" width="220" height="250" rx="10" fill="#1f2a44" stroke="#0f172a" stroke-width="2"/>
  <text x="150" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">ESP32 DevKit V1</text>
  <text x="150" y="119" text-anchor="middle" font-size="12" fill="#c7d2e5">30-pin WROOM-32</text>
  <rect x="56" y="180" width="34" height="40" rx="3" fill="#9aa4b2"/>
  <text x="73" y="238" text-anchor="middle" font-size="11" fill="#c7d2e5">USB</text>

  <!-- Amp -->
  <rect x="460" y="70" width="190" height="250" rx="10" fill="#14532d" stroke="#052e16" stroke-width="2"/>
  <text x="555" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">NS4168 I2S amp</text>
  <text x="555" y="119" text-anchor="middle" font-size="12" fill="#c9e7d3">mono, Class-D</text>

  <!-- Wires -->
  <g stroke-width="5" stroke-linecap="round">
    <line x1="260" y1="150" x2="460" y2="150" stroke="#d1242f"/>
    <line x1="260" y1="185" x2="460" y2="185" stroke="#24292f"/>
    <line x1="260" y1="220" x2="460" y2="220" stroke="#0969da"/>
    <line x1="260" y1="255" x2="460" y2="255" stroke="#1a7f37"/>
    <line x1="260" y1="290" x2="460" y2="290" stroke="#bc4c00"/>
  </g>
  <g fill="#d0d7de" stroke="#57606a" stroke-width="1.5">
    <circle cx="260" cy="150" r="6"/><circle cx="260" cy="185" r="6"/><circle cx="260" cy="220" r="6"/><circle cx="260" cy="255" r="6"/><circle cx="260" cy="290" r="6"/>
    <circle cx="460" cy="150" r="6"/><circle cx="460" cy="185" r="6"/><circle cx="460" cy="220" r="6"/><circle cx="460" cy="255" r="6"/><circle cx="460" cy="290" r="6"/>
  </g>

  <!-- ESP32 pin labels -->
  <g font-size="14" font-weight="600" fill="#ffffff" text-anchor="end">
    <text x="244" y="155">VIN (5 V)</text>
    <text x="244" y="190">GND</text>
    <text x="244" y="225">GPIO26</text>
    <text x="244" y="260">GPIO25</text>
    <text x="244" y="295">GPIO33</text>
  </g>
  <!-- Amp pin labels -->
  <g font-size="14" font-weight="600" fill="#ffffff">
    <text x="476" y="155">VIN</text>
    <text x="476" y="190">GND</text>
    <text x="476" y="225">BCLK</text>
    <text x="476" y="260">LRC</text>
    <text x="476" y="295">DIN</text>
  </g>
  <!-- Wire purposes -->
  <g font-size="12" fill="#57606a" text-anchor="middle">
    <text x="360" y="142">power</text>
    <text x="360" y="177">ground</text>
    <text x="360" y="212">bit clock</text>
    <text x="360" y="247">word select</text>
    <text x="360" y="282">audio data</text>
  </g>

  <!-- Speaker -->
  <line x1="650" y1="195" x2="710" y2="195" stroke="#57606a" stroke-width="4" stroke-linecap="round"/>
  <text x="680" y="185" text-anchor="middle" font-size="11" fill="#57606a">PH2.0</text>
  <rect x="710" y="145" width="100" height="100" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
  <circle cx="760" cy="195" r="30" fill="#d0d7de" stroke="#57606a" stroke-width="2"/>
  <circle cx="760" cy="195" r="10" fill="#57606a"/>
  <text x="760" y="266" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Speaker</text>
  <text x="760" y="283" text-anchor="middle" font-size="11" fill="#57606a">3 W, on the amp</text>

  <text x="420" y="356" text-anchor="middle" font-size="12" fill="#57606a">The NS4168 has no MCLK pin. Static that ignores the volume slider means DIN is half-seated.</text>
</svg>
